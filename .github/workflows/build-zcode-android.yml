name: Build ZCode Android APK

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "zai-org/ZCode 的 ref（分支/标签/提交）"
        required: true
        default: main
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout upstream (sparse)
        uses: actions/checkout@v5
        with:
          repository: zai-org/ZCode
          ref: ${{ inputs.upstream_ref || 'main' }}
          sparse-checkout: packages/android
          path: zcode
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK platform and build-tools
        run: |
          CMD=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $CMD"
          "$CMD" --version
          yes | "$CMD" --licenses >/dev/null 2>&1 || true
          "$CMD" --install "platforms;android-36.1" "build-tools;36.1.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > zcode/packages/android/local.properties
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: zcode/packages/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find zcode/packages/android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out/
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
          git -C zcode rev-parse HEAD | tee out/upstream-commit.txt
          git -C zcode log -1 --format='%ci %s' >> out/upstream-commit.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zcode-android-debug
          path: out/
          if-no-files-found: error
          retention-days: 30
