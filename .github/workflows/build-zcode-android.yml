name: Build ZCode Android APK

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "zai-org/ZCode 的 ref（分支/标签/提交）"
        required: true
        default: main
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout upstream (sparse)
        uses: actions/checkout@v5
        with:
          repository: zai-org/ZCode
          ref: ${{ inputs.upstream_ref || 'main' }}
          sparse-checkout: packages/android
          path: zcode
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK platform and build-tools
        run: |
          CMD=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $CMD"
          "$CMD" --version
          yes | "$CMD" --licenses >/dev/null 2>&1 || true
          "$CMD" --install "platforms;android-36.1" "build-tools;36.1.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > zcode/packages/android/local.properties
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools"

      - name: Verify source tree is untouched
        run: |
          cd zcode
          echo "checkout: $(git rev-parse HEAD)"
          changes=$(git status --porcelain | grep -v '^?? packages/android/local.properties$' || true)
          if [ -n "$changes" ]; then
            echo "::error::上游源码树出现预期外的改动，终止构建"
            echo "$changes"
            exit 1
          fi
          echo "OK：除 local.properties（仅含 SDK 路径）外，源码零改动"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (unsigned)
        working-directory: zcode/packages/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK with stable release key
        env:
          ZCODE_KEYSTORE_B64: ${{ secrets.ZCODE_KEYSTORE_B64 }}
          ZCODE_KEYSTORE_PASS: ${{ secrets.ZCODE_KEYSTORE_PASS }}
          ZCODE_KEY_PASS: ${{ secrets.ZCODE_KEY_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/36.1.0)
          echo "$ZCODE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          IN=$(find zcode/packages/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "unsigned: $IN"
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-key-alias zcode \
            --ks-pass "env:ZCODE_KEYSTORE_PASS" \
            --key-pass "env:ZCODE_KEY_PASS" \
            --v1-signing-enabled false --v2-signing-enabled true \
            --out "$RUNNER_TEMP/zcode-android-release.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/zcode-android-release.apk"

      - name: Collect APK
        run: |
          mkdir -p out
          SHA=$(git -C zcode rev-parse --short=8 HEAD)
          cp "$RUNNER_TEMP/zcode-android-release.apk" "out/zcode-android-$SHA-release.apk"
          ls -lh out/
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
          git -C zcode rev-parse HEAD | tee out/upstream-commit.txt
          git -C zcode log -1 --format='%ci %s' >> out/upstream-commit.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zcode-android-release
          path: out/
          if-no-files-found: error
          retention-days: 30
