name: Build ZCode Android APK

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "zai-org/ZCode 的 ref（分支/标签/提交）"
        required: true
        default: main
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "patches/**"
      - "icon/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build repo (patches)
        uses: actions/checkout@v5
        with:
          path: self
          persist-credentials: false

      - name: Checkout upstream (sparse)
        uses: actions/checkout@v5
        with:
          repository: zai-org/ZCode
          ref: ${{ inputs.upstream_ref || 'main' }}
          sparse-checkout: packages/android
          path: zcode
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK platform and build-tools
        run: |
          CMD=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $CMD"
          "$CMD" --version
          yes | "$CMD" --licenses >/dev/null 2>&1 || true
          "$CMD" --install "platforms;android-36.1" "build-tools;36.1.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > zcode/packages/android/local.properties
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools"

      - name: Verify source tree is untouched
        run: |
          cd zcode
          echo "checkout: $(git rev-parse HEAD)"
          changes=$(git status --porcelain | grep -v '^?? packages/android/local.properties$' || true)
          if [ -n "$changes" ]; then
            echo "::error::上游源码树出现预期外的改动，终止构建"
            echo "$changes"
            exit 1
          fi
          echo "OK：除 local.properties（仅含 SDK 路径）外，源码零改动"

      - name: Apply local patches
        run: |
          cd zcode
          for p in "$GITHUB_WORKSPACE"/self/patches/*.patch; do
            echo "::group::$(basename "$p")"
            git apply -v "$p"
            echo "::endgroup::"
          done
          echo "--- 应用后的改动 ---"
          git diff --stat
          # 断言：上游源码树里的改动必须恰好等于 patches/ 下所有补丁的拼接
          cat "$GITHUB_WORKSPACE"/self/patches/*.patch > "$RUNNER_TEMP/expected.patch"
          git diff > "$RUNNER_TEMP/actual.patch"
          diff -u "$RUNNER_TEMP/expected.patch" "$RUNNER_TEMP/actual.patch" \
            || { echo "::error::源码树改动与 patches/ 不一致，终止构建"; exit 1; }
          echo "OK：源码树改动 == patches/ 下的补丁"

      - name: Apply launcher icon overlay
        run: |
          cd zcode
          RES=packages/android/app/src/main/res
          # 上游图标是 .webp + 两个 vector（AOSP 模板），整套换成 ZCode 官方图标（icon/res 由 icon/generate.py 生成）
          rm -f "$RES"/mipmap-*/ic_launcher.webp "$RES"/mipmap-*/ic_launcher_round.webp
          cp -R "$GITHUB_WORKSPACE"/self/icon/res/. "$RES"/
          echo "--- res 改动 ---"
          git status --porcelain | grep "$RES" || true
          # 图标只允许动 res/：把 res/ 排除掉之后，改动必须仍然逐字节等于补丁
          git diff -- . ":(exclude)$RES" > "$RUNNER_TEMP/after_icon.patch"
          diff -u "$RUNNER_TEMP/expected.patch" "$RUNNER_TEMP/after_icon.patch" \
            || { echo "::error::图标覆盖步骤改动了 res/ 以外的文件"; exit 1; }
          # res/ 里也不许冒出图标以外的改动（含未跟踪文件）
          stray=$(git status --porcelain \
            | grep -v '^?? packages/android/local.properties$' \
            | grep -vE "$RES/" || true)
          if [ -n "$stray" ]; then
            echo "::error::图标覆盖步骤出现了 res/ 之外的改动"
            echo "$stray"
            exit 1
          fi
          echo "OK：图标只动了 res/"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (unsigned)
        working-directory: zcode/packages/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK with stable release key
        env:
          ZCODE_KEYSTORE_B64: ${{ secrets.ZCODE_KEYSTORE_B64 }}
          ZCODE_KEYSTORE_PASS: ${{ secrets.ZCODE_KEYSTORE_PASS }}
          ZCODE_KEY_PASS: ${{ secrets.ZCODE_KEY_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/36.1.0)
          echo "$ZCODE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          IN=$(find zcode/packages/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "unsigned: $IN"
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-key-alias zcode \
            --ks-pass "env:ZCODE_KEYSTORE_PASS" \
            --key-pass "env:ZCODE_KEY_PASS" \
            --v1-signing-enabled false --v2-signing-enabled true \
            --out "$RUNNER_TEMP/zcode-android-release.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/zcode-android-release.apk"

      - name: Collect APK
        run: |
          mkdir -p out
          SHA=$(git -C zcode rev-parse --short=8 HEAD)
          cp "$RUNNER_TEMP/zcode-android-release.apk" "out/zcode-android-$SHA-patched.apk"
          ls -lh out/
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
          git -C zcode rev-parse HEAD | tee out/upstream-commit.txt
          git -C zcode log -1 --format='%ci %s' >> out/upstream-commit.txt
          sha256sum self/patches/*.patch > out/patches.txt
          ls self/patches >> out/patches.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zcode-android-release
          path: out/
          if-no-files-found: error
          retention-days: 30

      # artifact 会被重定向到 *.blob.core.windows.net（本次实测落在南非的
      # productionresultssa19），国内直连基本拉不动；Release 附件走
      # objects.githubusercontent.com，既能挂代理也能套加速前缀，所以同时发一份
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "latest" \
            --notes "commit ${{ github.sha }}，上游 $(head -1 out/upstream-commit.txt)" \
            --latest \
            out/*.apk out/SHA256SUMS.txt out/upstream-commit.txt out/patches.txt
          echo "直链：https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename out/*.apk)"
